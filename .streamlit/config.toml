[theme]
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8fafc"
textColor = "#0f172a"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
runOnSave = false

[client]
showErrorDetails = true
showSidebarNavigation = true
toolbarMode = "minimal"
