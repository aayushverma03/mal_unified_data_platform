name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv venv --python 3.11

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Install dependencies
        run: |
          uv pip install -r requirements.txt
          uv pip install -e .

      - name: Run pipeline (so report has data)
        run: |
          uv run python -m mal_payments.run seed
          uv run python -m mal_payments.run ingest

      - name: Render live report
        run: uv run quarto render docs/report.qmd

      - name: Render architecture (HTML + PDF)
        run: uv run quarto render docs/architecture.qmd

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
