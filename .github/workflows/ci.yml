name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv pip install -r requirements.txt
          uv pip install -e .

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Tests
        run: uv run pytest

      - name: Line-count check (pipeline budget)
        run: ./scripts/line_count_check.sh

      - name: End-to-end smoke (seed -> ingest -> migrate)
        run: |
          uv run python -m mal_payments.run seed
          uv run python -m mal_payments.run ingest
          uv run python -m mal_payments.run migrate
